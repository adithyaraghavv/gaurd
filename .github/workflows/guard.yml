name: guard

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC: live scan of staging

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  static:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install guard (no third-party Python deps)
        run: pip install git+https://github.com/${{ github.repository_owner }}/guard.git
      # Pin every scanner version. Add trivy and gitleaks via their official
      # GitHub Actions pinned to a commit SHA; see TRUST.md.
      - name: Install semgrep
        run: pip install semgrep==1.95.0
      - name: Static scan
        run: |
          guard init
          guard scan --no-live
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: guard_out/report.sarif

  live-staging:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/${{ github.repository_owner }}/guard.git
      - name: Live checks against STAGING only
        env:
          GUARD_CONFIG_JSON: ${{ secrets.GUARD_CONFIG_JSON }}
          TENANT_A_TOKEN: ${{ secrets.TENANT_A_TOKEN }}
          TENANT_B_TOKEN: ${{ secrets.TENANT_B_TOKEN }}
        run: |
          printf '%s' "$GUARD_CONFIG_JSON" > guard.config.json
          guard scan
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-report
          path: guard_out/
      - name: Open an issue if the scan found problems
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Guard scan found issues" --body-file guard_out/summary.md
