[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-kit"
version = "0.1.0"
description = "Self-owned security testing kit: scope-guarded checks plus pinned scanner wrappers. Zero third-party Python dependencies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
guard = "guard.cli:main"

[tool.setuptools.packages.find]
include = ["guard*"]
